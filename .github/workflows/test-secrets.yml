name: Test Secrets

on:
  push:
    branches: [main]

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secrets are available
        run: |
          echo "Checking PROD_HOST..."
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "❌ PROD_HOST is EMPTY!"
          else
            echo "✅ PROD_HOST is NOT empty."
          fi
          
          echo "Checking PROD_USER..."
          if [ -z "${{ secrets.PROD_USER }}" ]; then
            echo "❌ PROD_USER is EMPTY!"
          else
            echo "✅ PROD_USER is NOT empty."
          fi
          
          echo "Checking PROD_PATH..."
          if [ -z "${{ secrets.PROD_PATH }}" ]; then
            echo "❌ PROD_PATH is EMPTY!"
          else
            echo "✅ PROD_PATH is NOT empty."
          fi
